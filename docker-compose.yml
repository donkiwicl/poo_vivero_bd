# MySQL 8.4 para el caso del Vivero. Uso:  docker compose up -d
# Los scripts de sql/ se ejecutan solos la PRIMERA vez que se crea el volumen.
# Para recrear la base desde cero:  docker compose down -v && docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: vivero-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "1234"
    ports:
      - "3306:3306"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - vivero-datos:/var/lib/mysql
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/02_datos.sql:/docker-entrypoint-initdb.d/02_datos.sql:ro
volumes:
  vivero-datos:
